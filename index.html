<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Academic Words</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#16181d; --muted:#6b7280; --line:#e3e5ea;
  --accent:#2f6fde; --accent-text:#ffffff; --ok:#1f9d55; --ok-bg:#e3f6ea; --bad:#d64545; --bad-bg:#fbe7e7;
  --warn:#b7791f; --warn-bg:#fdf3de;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --card:#1c1f24; --text:#eceef2; --muted:#9aa1ad; --line:#2c3038;
    --accent:#5b8ff0; --accent-text:#ffffff; --ok:#3ccf7a; --ok-bg:#16301f; --bad:#f06a6a; --bad-bg:#3a1c1c;
    --warn:#e7b04c; --warn-bg:#3a2e14;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --card:#1c1f24; --text:#eceef2; --muted:#9aa1ad; --line:#2c3038;
  --accent:#5b8ff0; --accent-text:#ffffff; --ok:#3ccf7a; --ok-bg:#16301f; --bad:#f06a6a; --bad-bg:#3a1c1c;
  --warn:#e7b04c; --warn-bg:#3a2e14;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 32px;min-height:100vh}
h1{font-size:24px;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.mode{display:block;width:100%;text-align:left;cursor:pointer;margin-bottom:12px;color:var(--text);font:inherit}
.mode:active{transform:scale(.99)}
.mode b{display:block;font-size:17px;margin-bottom:2px}
.mode span{color:var(--muted);font-size:14px}
.label{font-size:13px;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--text);font:inherit;padding:8px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-text)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--accent-text)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}
.link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:8px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.count{font-size:13px;color:var(--muted);min-width:48px;text-align:right}
.q-kind{font-size:13px;color:var(--muted);margin-bottom:8px}
.q-word{font-size:30px;font-weight:700;line-height:1.2;margin:6px 0 4px;word-break:break-word}
.q-def{font-size:19px;line-height:1.45;margin:4px 0}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:14px;
  font:inherit;text-align:left;cursor:pointer}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--text)}
input.ans{width:100%;margin-top:16px;font:inherit;font-size:20px;padding:14px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none}
input.ans:focus{border-color:var(--accent)}
.hint{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;color:var(--muted);margin-top:10px;font-size:17px;word-break:break-all}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)} .fb.warn{background:var(--warn-bg)}
.fb b{font-size:17px}
.fb .extra{color:var(--muted);margin-top:6px;font-size:14px}
.big{font-size:44px;font-weight:800;margin:4px 0}
.list{margin-top:10px}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item b{display:block}
.item .ru{color:var(--accent);font-size:14px}
.item .d{color:var(--muted);font-size:14px}
.item .st{float:right;font-size:12px;color:var(--muted)}
.search{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);margin-bottom:10px}
.hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== Словарь: w — слово, ru — перевод, d — определение, alt — другие принимаемые написания =====
const WORDS = [
 {w:"apply", ru:"подавать заявление, обращаться", d:"to request something, usually officially, especially in writing or by sending in a form"},
 {w:"application", ru:"заявление, заявка", d:"an official request for something, usually in writing"},
 {w:"advanced", ru:"передовой, продвинутый", d:"modern and well developed"},
 {w:"advances", ru:"достижения, успехи", d:"an improvement or development in something"},
 {w:"award", ru:"награда, премия", d:"a prize or a sum of money that a person or organization is given for an achievement"},
 {w:"data", ru:"данные", d:"information, especially facts or numbers, collected to be examined and considered and used to help decision-making"},
 {w:"number", ru:"число, номер", d:"a unit that forms part of the system of counting and calculating"},
 {w:"require", ru:"требовать, нуждаться", d:"to need something or make something necessary"},
 {w:"requirement", ru:"требование", d:"something that you must do, or something you need"},
 {w:"work experience", ru:"опыт работы", d:"the experience that a person already has of working"},
 {w:"means", ru:"средство, способ", d:"a method or way of doing something"},
 {w:"higher education", ru:"высшее образование", d:"education at a college or university where subjects are studied at an advanced level"},
 {w:"high school", ru:"старшая школа", d:"a school for older children, usually children from grades 9-12"},
 {w:"sciences", ru:"естественные науки", d:"subjects such as biology, physics, and chemistry in which things that can be seen in nature are studied"},
 {w:"humanities", ru:"гуманитарные науки", d:"subjects such as literature, history, languages and philosophy that study human culture and society"},
 {w:"degree", ru:"учёная степень, диплом", d:"the qualification given to a student after he or she has completed his or her studies"},
 {w:"Bachelor's Degree", ru:"степень бакалавра", d:"a first degree at college or university"},
 {w:"Master's Degree", ru:"степень магистра", d:"an advanced college or university degree"},
 {w:"Specialist's Degree", ru:"степень специалиста", d:"a degree given in Russia after five or more years of university study in one professional field"},
 {w:"Candidate's Degree", ru:"степень кандидата наук", d:"a Russian research degree, the first scientific degree after postgraduate study, similar to a Ph.D."},
 {w:"Doctor's Degree", ru:"степень доктора наук", d:"one of the highest-ranking degrees given by a university"},
 {w:"Ph.D.", ru:"доктор философии (учёная степень)", d:"the highest college or university degree, or someone who has this", alt:["phd"]},
 {w:"qualifications", ru:"квалификация", d:"an ability, characteristic, or experience that makes you suitable for a particular job or activity"},
 {w:"department", ru:"кафедра, отделение", d:"a part of an organization such as a school, business, or government that deals with a particular area of study or work"},
 {w:"graduate", ru:"выпускник", d:"a person who has a first degree from a university or college"},
 {w:"undergraduate", ru:"студент (бакалавриата)", d:"a student who is studying for their first degree at a college or university"},
 {w:"postgraduate", ru:"аспирант, магистрант", d:"a student who has already received one degree and is studying at a university for a more advanced degree"},
 {w:"complete", ru:"завершать, заканчивать", d:"to make whole or perfect"},
 {w:"foundation", ru:"основание", d:"an occasion when an organization, state, etc. is established"},
 {w:"term", ru:"семестр, четверть", d:"one of the periods into which a year is divided at school, college, or university"},
 {w:"academic year", ru:"учебный год", d:"the period of the year during which students attend school or university, usually from September to June"},
 {w:"pass", ru:"сдача экзамена, зачёт", d:"a successful result in an exam"},
 {w:"examination", ru:"экзамен", d:"a formal test that you must pass in order to earn a particular qualification", alt:["exam"]},
 {w:"examination period", ru:"экзаменационная сессия", d:"the time at the end of a term when students take their exams", alt:["exam period"]},
 {w:"class", ru:"занятие, пара", d:"a period of time in which students are taught something"},
 {w:"lecture", ru:"лекция", d:"a formal talk on a serious subject given to a group of people, especially students"},
 {w:"seminar", ru:"семинар", d:"an occasion when a teacher or expert and a group of people meet to study and discuss something"},
 {w:"time-table", ru:"расписание", d:"a list of the times when classes in school/university happen"},
 {w:"library card", ru:"читательский билет", d:"a membership card issued by a school, university, or local public library that grants students special borrowing, digital, and academic privileges"},
 {w:"student card", ru:"студенческий билет", d:"an official identification document issued by a school, college, or university that proves you are currently enrolled as a student"},
 {w:"record book", ru:"зачётная книжка", d:"an official document or system used to track a student's academic progress, course enrollments, exam grades, practical training, and research work"},
 {w:"test", ru:"тест, контрольная работа", d:"a way of discovering, by questions or practical activities, what someone knows, or what someone or something can do or is like"},
 {w:"course paper", ru:"курсовая работа", d:"a major written research assignment submitted by a student to fulfill the requirements of an academic course or semester"},
 {w:"thesis", ru:"дипломная работа, диссертация", d:"a long piece of writing on a particular subject, especially one that is done for a higher college or university degree"},
 {w:"the State examination", ru:"государственный экзамен", d:"an examination that is taken by students in every university", alt:["state exam"]},
 {w:"aim", ru:"цель", d:"a result that your plans or actions are intended to achieve"},
 {w:"success", ru:"успех", d:"the achieving of the results wanted or hoped for"},
 {w:"necessary", ru:"необходимый", d:"needed in order to achieve a particular result"},
 {w:"several", ru:"несколько", d:"some; an amount that is not exact but is fewer than many"},
 {w:"monitor", ru:"староста", d:"a student chosen to act as a bridge between the academic group and the faculty, administration, or lecturers"},
 {w:"lecturer", ru:"преподаватель, лектор", d:"someone who teaches at a college or university"},
 {w:"accept", ru:"принимать", d:"to say yes to an offer or invitation"},
 {w:"study for a degree", ru:"учиться на степень", d:"to do a course of study at a college or university"},
 {w:"do courses", ru:"проходить курсы", d:"to do a set of classes or a plan of study on a particular subject, often in order to take an exam or obtain a qualification"},
 {w:"make good/poor progress", ru:"делать хорошие/плохие успехи", d:"how well a student is moving toward the successful completion of their degree requirements within the expected timeframe", alt:["make good progress","make poor progress","make good or poor progress"]},
 {w:"take exams", ru:"сдавать экзамены", d:"if a student does this, they are tested on their knowledge or skill in a particular subject"},
 {w:"pass exams", ru:"сдать экзамены", d:"to successfully complete a test or examination"},
 {w:"fail exams", ru:"провалить экзамены", d:"to not achieve the required score, grade, or standard needed to pass a test or qualification"},
 {w:"resit exams", ru:"пересдавать экзамены", d:"to take an examination or test again"},
 {w:"revise for exams", ru:"готовиться к экзаменам (повторять)", d:"to study again material you have already learned in order to refresh your memory and prepare for a test"},
 {w:"follow", ru:"следовать", d:"to obey or to act as ordered by someone"},
 {w:"provide", ru:"обеспечивать, предоставлять", d:"to give someone something that they need"},
 {w:"last", ru:"длиться", d:"to continue to exist"},
 {w:"lead to", ru:"приводить к", d:"to cause someone to do something, especially something bad"},
 {w:"include", ru:"включать", d:"to contain something as a part of something else, or to make something part of something else"},
 {w:"involve", ru:"вовлекать, включать в себя", d:"to include someone in something, or to make them take part in or feel part of it"},
 {w:"defend", ru:"защищать", d:"to protect someone or something against attack or criticism"},
 {w:"create", ru:"создавать", d:"to make something new, or invent something"},
 {w:"offer", ru:"предлагать", d:"to ask someone if they would like to have something or if they would like you to do something"},
 {w:"Oxbridge", ru:"Оксбридж (Оксфорд и Кембридж)", d:"the universities of Oxford and Cambridge, considered as a unit separate from other universities in Britain"},
 {w:"red-brick universities", ru:"«краснокирпичные» университеты", d:"British universities that were built in the late 19th or early 20th centuries"},
 {w:"plate-glass universities", ru:"университеты «из листового стекла» (1960-х)", d:"a group of universities in the UK that were built or became universities in the 1960s"},
 {w:"polytechnics", ru:"политехнические институты", d:"a college where students study for degrees, especially in technical subjects, or train for particular types of work"},
 {w:"Open university", ru:"Открытый университет (дистанционный)", d:"in the UK, a university that usually accepts students without formal qualifications and allows them to study from home, receiving and sending work by post, by email, or over the internet"},
 {w:"tuition (system)", ru:"плата за обучение, система платного обучения", d:"the money that you pay for being taught at a college or university, or the system of paying for education", alt:["tuition","tuition system"]},
 {w:"academic record", ru:"успеваемость, академическая справка", d:"an official record of all the courses a student has taken and the marks they have received"},
 {w:"to be expelled", ru:"быть отчисленным", d:"to be officially made to leave a school, college or university, usually because of bad behaviour or poor results", alt:["be expelled","get expelled"]},
];

// ===== Telegram =====
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (inTg) {
  try {
    tg.ready(); tg.expand();
    document.documentElement.setAttribute("data-theme", tg.colorScheme === "dark" ? "dark" : "light");
    const p = tg.themeParams || {}, s = document.documentElement.style;
    if (p.bg_color) { s.setProperty("--bg", p.secondary_bg_color || p.bg_color); s.setProperty("--card", p.bg_color); }
    if (p.text_color) s.setProperty("--text", p.text_color);
    if (p.hint_color) s.setProperty("--muted", p.hint_color);
    if (p.button_color) s.setProperty("--accent", p.button_color);
    if (p.button_text_color) s.setProperty("--accent-text", p.button_text_color);
  } catch (e) {}
}
function haptic(type){ try{ if(inTg) tg.HapticFeedback.notificationOccurred(type); }catch(e){} }

// ===== Хранилище статистики по словам =====
const KEY = "acwords.stats.v1";
let stats = {};
try { stats = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { stats = {}; }
function saveStats(){ try { localStorage.setItem(KEY, JSON.stringify(stats)); } catch (e) {} }
function mark(i, ok){ const k = WORDS[i].w; const s = stats[k] || (stats[k] = {ok:0, bad:0}); ok ? s.ok++ : s.bad++; saveStats(); }
function hardList(){ return WORDS.map((x,i)=>i).filter(i => { const s = stats[WORDS[i].w]; return s && s.bad > 0 && s.bad >= s.ok; }); }

// ===== Утилиты =====
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function norm(s){
  return s.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[().]/g,"").replace(/[-–—]/g," ")
    .replace(/\s+/g," ").trim().replace(/^to /,"").replace(/^the /,"");
}
const key = s => norm(s).replace(/[ '\/]/g,"");
function accepted(item){ return [item.w, ...(item.alt||[])].map(key); }
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
function judge(input, item){
  const k = key(input); if (!k) return "empty";
  const acc = accepted(item);
  if (acc.includes(k)) return "ok";
  for (const a of acc){ const tol = a.length >= 10 ? 2 : a.length >= 4 ? 1 : 0; if (lev(k,a) <= tol) return "typo"; }
  return "bad";
}

// ===== Состояние =====
let settings = { size: 20 };
try { const s = JSON.parse(localStorage.getItem("acwords.settings")); if (s && s.size !== undefined) settings = s; } catch(e){}
let G = null; // текущая игра

// ===== Меню =====
function menu(){
  G = null;
  const hard = hardList();
  const seen = WORDS.filter(x => stats[x.w] && stats[x.w].ok > 0).length;
  $app.innerHTML = `
    <h1>Academic Words</h1>
    <p class="sub">${WORDS.length} слов к диктанту · уже отвечено верно: ${seen}</p>
    <button class="card mode" data-mode="ru"><b>Слово → перевод</b><span>Видишь английское слово, выбираешь перевод из четырёх</span></button>
    <button class="card mode" data-mode="def"><b>Определение → слово</b><span>Читаешь определение и пишешь слово сам, как на диктанте</span></button>
    <div class="label">Слов за раунд</div>
    <div class="seg" id="size">
      ${[10,20,40,0].map(n=>`<button data-n="${n}" class="${settings.size===n?"on":""}">${n||"Все"}</button>`).join("")}
    </div>
    <div class="label">Сложные слова: ${hard.length}</div>
    <div class="row" style="margin-top:0">
      <button class="btn ghost" id="hardRu" ${hard.length?"":"disabled"}>Перевод</button>
      <button class="btn ghost" id="hardDef" ${hard.length?"":"disabled"}>Написание</button>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:14px">
      <button class="link" id="dict">Весь словарь</button>
      <button class="link" id="reset" style="color:var(--muted)">Сбросить статистику</button>
    </div>`;
  $app.querySelectorAll(".mode").forEach(b => b.onclick = () => start(b.dataset.mode, null));
  $app.querySelectorAll("#size button").forEach(b => b.onclick = () => {
    settings.size = +b.dataset.n; try{ localStorage.setItem("acwords.settings", JSON.stringify(settings)); }catch(e){}
    menu();
  });
  document.getElementById("hardRu").onclick = () => start("ru", hardList());
  document.getElementById("hardDef").onclick = () => start("def", hardList());
  document.getElementById("dict").onclick = dictionary;
  document.getElementById("reset").onclick = () => { if (confirm("Сбросить всю статистику по словам?")) { stats = {}; saveStats(); menu(); } };
}

// ===== Игра =====
function start(mode, only){
  let pool = only ? shuffle(only) : shuffle(WORDS.map((x,i)=>i));
  if (!only && settings.size) pool = pool.slice(0, settings.size);
  G = { mode, pool, queue: pool.map(i => ({i})), done: 0, firstTry: 0, wrong: new Set(), cur: null };
  next();
}
function next(){
  if (!G) return;
  if (!G.queue.length) return results();
  G.cur = G.queue.shift();
  G.cur.hints = 0; G.answered = false;
  G.mode === "ru" ? renderRu() : renderDef();
}
function header(){
  const pct = Math.round(G.done / G.pool.length * 100);
  return `<div class="top"><button class="link" id="quit">✕</button><div class="bar"><i style="width:${pct}%"></i></div><div class="count">${G.done}/${G.pool.length}</div></div>`;
}
function bindQuit(){ document.getElementById("quit").onclick = () => { if (G.done === 0 || confirm("Выйти из раунда?")) menu(); }; }

// Повторно задать слово через несколько вопросов
function requeue(){ const pos = Math.min(G.queue.length, 2 + Math.floor(Math.random()*3)); G.queue.splice(pos, 0, {i: G.cur.i, again: true}); }
function finish(correct, scored){
  G.answered = true;
  const i = G.cur.i;
  mark(i, correct && scored);
  if (correct) { G.done++; if (scored && !G.cur.again) G.firstTry++; }
  if (!correct || !scored) G.wrong.add(i);
  if (!correct) requeue();
}

// --- Режим 1: слово → перевод
function renderRu(){
  const item = WORDS[G.cur.i];
  const others = shuffle([...new Set(WORDS.filter(x => x.ru !== item.ru).map(x => x.ru))]).slice(0,3);
  const opts = shuffle([item.ru, ...others]);
  $app.innerHTML = header() + `
    <div class="card">
      <div class="q-kind">Выбери перевод</div>
      <div class="q-word">${esc(item.w)}</div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
      <div id="fb"></div>
    </div>`;
  bindQuit();
  const btns = [...$app.querySelectorAll(".opt")];
  btns.forEach(b => b.onclick = () => {
    if (G.answered) return;
    const pick = opts[+b.dataset.k], ok = pick === item.ru;
    btns.forEach(x => { x.disabled = true; if (opts[+x.dataset.k] === item.ru) x.classList.add("ok"); });
    if (!ok) b.classList.add("bad");
    finish(ok, true); haptic(ok ? "success" : "error");
    showFb(ok ? "ok" : "bad", ok ? "Верно!" : `Правильно: <b>${esc(item.ru)}</b>`, esc(item.d));
  });
}

// --- Режим 2: определение → слово
function renderDef(){
  const item = WORDS[G.cur.i];
  $app.innerHTML = header() + `
    <div class="card">
      <div class="q-kind">Напиши слово по определению</div>
      <div class="q-def">${esc(item.d)}</div>
      <input class="ans" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Слово на английском">
      <div class="hint" id="hint"></div>
      <div class="row" id="ctl">
        <button class="btn ghost" id="hintBtn">Подсказка</button>
        <button class="btn ghost" id="skip">Не знаю</button>
      </div>
      <button class="btn" id="check" style="margin-top:10px">Проверить</button>
      <div id="fb"></div>
    </div>`;
  bindQuit();
  const inp = document.getElementById("ans");
  setTimeout(() => inp.focus(), 50);
  document.getElementById("hintBtn").onclick = () => {
    if (G.answered) return;
    const w = item.w; G.cur.hints = Math.min(G.cur.hints + 1, w.replace(/[^A-Za-z]/g,"").length);
    let shown = 0;
    document.getElementById("hint").textContent = [...w].map(c => /[A-Za-z]/.test(c) ? (shown++ < G.cur.hints ? c : "_") : c).join("");
    inp.focus();
  };
  document.getElementById("skip").onclick = () => { if (!G.answered) submit(true); };
  document.getElementById("check").onclick = () => submit(false);
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); if (!G.answered) submit(false); } };

  function submit(giveUp){
    const val = inp.value;
    const r = giveUp ? "bad" : judge(val, item);
    if (r === "empty") { inp.focus(); return; }
    inp.disabled = true;
    document.getElementById("ctl").classList.add("hidden");
    document.getElementById("check").classList.add("hidden");
    if (r === "ok") {
      const clean = G.cur.hints === 0;
      finish(true, clean); haptic("success");
      showFb("ok", clean ? "Верно!" : "Верно, но с подсказкой: слово попадёт в повторение", `<b>${esc(item.w)}</b> — ${esc(item.ru)}`);
    } else if (r === "typo") {
      finish(true, false); haptic("warning");
      showFb("warn", `Почти! Правильно пишется: <b>${esc(item.w)}</b>`, `У тебя: ${esc(val)} · ${esc(item.ru)}`);
    } else {
      finish(false, false); haptic("error");
      showFb("bad", `${giveUp ? "Ответ" : "Неверно, правильно"}: <b>${esc(item.w)}</b>`, `${esc(item.ru)} · это слово скоро спросят снова`);
    }
  }
}

function showFb(kind, title, extraHtml){
  document.getElementById("fb").innerHTML = `<div class="fb ${kind}">${title}${extraHtml ? `<div class="extra">${extraHtml}</div>` : ""}</div>
    <button class="btn" id="nextBtn" style="margin-top:12px">Дальше</button>`;
  const nb = document.getElementById("nextBtn");
  nb.onclick = next;
  nb.focus();
}
document.addEventListener("keydown", e => {
  if (!G) return;
  if (e.key === "Enter" && G.answered && document.activeElement && document.activeElement.id !== "nextBtn") { e.preventDefault(); next(); }
  if (G.mode === "ru" && !G.answered && /^[1-4]$/.test(e.key)) { const b = $app.querySelectorAll(".opt")[+e.key-1]; if (b) b.click(); }
});

// ===== Итоги =====
function results(){
  const total = G.pool.length, wrong = [...G.wrong];
  const pct = Math.round((total - wrong.length) / total * 100);
  const mode = G.mode;
  G = null;
  $app.innerHTML = `
    <h1>Раунд пройден</h1>
    <div class="card">
      <div class="q-kind">С первой попытки</div>
      <div class="big">${total - wrong.length} / ${total}</div>
      <div class="sub" style="margin:0">${pct >= 90 ? "Отлично, к диктанту почти готов!" : pct >= 70 ? "Хорошо! Пройди ошибки ещё раз." : "Стоит пройти ошибки ещё пару раз."}</div>
    </div>
    ${wrong.length ? `<div class="label">Повторить (${wrong.length})</div>
    <div class="card list">${wrong.map(i => `<div class="item"><b>${esc(WORDS[i].w)}</b><div class="ru">${esc(WORDS[i].ru)}</div></div>`).join("")}</div>` : ""}
    <div style="margin-top:16px">
      ${wrong.length ? `<button class="btn" id="again">Пройти ошибки ещё раз</button>` : ""}
      <div class="row">
        <button class="btn ghost" id="other">${mode === "ru" ? "Режим «написание»" : "Режим «перевод»"}</button>
        <button class="btn ghost" id="home">В меню</button>
      </div>
    </div>`;
  if (wrong.length) document.getElementById("again").onclick = () => start(mode, wrong);
  document.getElementById("other").onclick = () => start(mode === "ru" ? "def" : "ru", null);
  document.getElementById("home").onclick = menu;
  haptic("success");
}

// ===== Словарь =====
function dictionary(){
  $app.innerHTML = `
    <div class="top"><button class="link" id="back">← Назад</button><div class="count">${WORDS.length} слов</div></div>
    <input class="search" id="q" placeholder="Поиск по слову или переводу">
    <div class="card list" id="list"></div>`;
  document.getElementById("back").onclick = menu;
  const draw = () => {
    const q = document.getElementById("q").value.trim().toLowerCase();
    document.getElementById("list").innerHTML = WORDS.filter(x => !q || (x.w + " " + x.ru).toLowerCase().includes(q)).map(x => {
      const s = stats[x.w];
      return `<div class="item">${s ? `<span class="st">✓${s.ok} ✗${s.bad}</span>` : ""}<b>${esc(x.w)}</b><div class="ru">${esc(x.ru)}</div><div class="d">${esc(x.d)}</div></div>`;
    }).join("") || `<div class="sub">Ничего не найдено</div>`;
  };
  document.getElementById("q").oninput = draw; draw();
}

menu();
</script>
